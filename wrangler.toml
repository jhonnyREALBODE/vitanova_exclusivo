name = "vitanova-acesso"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Sem build, sem dependências: o HTML aprovado entra no bundle como texto.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

